<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="stylesheet" href="style.css">
    <title>Analog Clock</title>
</head>
<body>
    <div class="container">
        <div class="clock">
            <div class="hand sec" id="sec"  style="--clr:#b14352; --h:90px;"><i></i></div>
            <div class="hand hour" id="hour" style="--clr:#00a6ff; --h:70px;"><i></i></div>
            <div class="hand min" id="min"  style="--clr:#ffffff; --h:80px;"><i></i></div>


            <span style = "--i:1;"><b>2</b></span>
            <span style = "--i:2;"><b>3</b></span>
            <span style = "--i:3;"><b>4</b></span>
            <span style = "--i:4;"><b>5</b></span>
            <span style = "--i:5;"><b>6</b></span>
            <span style = "--i:6;"><b>7</b></span>
            <span style = "--i:7;"><b>8</b></span>
            <span style = "--i:8;"><b>9</b></span>
            <span style = "--i:9;"><b>10</b></span>
            <span style = "--i:10"><b>11</b></span>
            <span style = "--i:11;"><b>12</b></span>
            <span style = "--i:12;"><b>1</b></span>
        </div>

    </div>
<script src="index.js"></script>
</body>
</html>
